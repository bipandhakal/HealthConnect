<!-- p_h.html: Shows paragraphs (<p>) and heading elements (<h1> to <h6>).
     Headings define document structure and should be used in order to convey hierarchy. Use <p> for paragraphs of text.
-->
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Paragraph</title>
    </head>
    <body>
        <h1>Main Heading</h1>
        <h2>Subheading (h2)</h2>
        <h3>Sub-subheading (h3)</h3>
        <p>First paragraph.</p>
        <p>Second paragraph.</p>
    </body>
</html>
